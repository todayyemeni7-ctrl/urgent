<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a0f1a" />
<meta name="description" content="أرشيف الأخبار العاجلة والشريط الإخباري — اليمن اليوم" />
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png" />
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
<title>أرشيف الأخبار والشريط — اليمن اليوم</title>
<link rel="stylesheet" href="fonts/fonts.css" media="print" onload="this.media='all'" />
<link rel="stylesheet" href="ui.css?v=4.18.25" media="print" onload="this.media='all'" />
<noscript><link rel="stylesheet" href="fonts/fonts.css" /><link rel="stylesheet" href="ui.css?v=4.18.25" /></noscript>
<link rel="manifest" href="manifest.webmanifest" />
<style>
  :root {
    --bg-page: #070b13;
    --card-bg: #0d1527;
    --border-card: rgba(255,255,255,0.08);
    --text-primary: #f8fafc;
    --text-muted: #94a3b8;
    --accent: #dc2626;
    --accent-green: #16a34a;
  }
  body {
    background: var(--bg-page);
    color: var(--text-primary);
    font-family: 'Noto Kufi Arabic', system-ui, -apple-system, sans-serif;
    margin: 0;
    padding: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .arch-nav {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    padding: 12px 20px;
    background: rgba(13,21,39,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    position: sticky;
    top: 0;
    z-index: 100;
    transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease;
    will-change: transform;
  }
  .arch-nav.nav-hidden {
    transform: translateY(-100%);
    opacity: 0;
    pointer-events: none;
  }
  .arch-brand {
    display: flex;
    align-items: center;
    gap: 12px;
    flex: 0 0 auto;
  }
  .arch-logo {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    object-fit: contain;
  }
  .arch-title h1 {
    font-size: 16px;
    font-weight: 800;
    margin: 0;
    color: #fff;
  }
  .arch-title p {
    font-size: 12px;
    margin: 2px 0 0;
    color: var(--text-muted);
  }
  .grow { flex: 1; }
  .arch-tools {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .arch-tools .chip,
  .arch-tools .nav-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 15px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.18);
    color: #ffffff !important;
    text-decoration: none;
    font-size: 13.5px;
    font-weight: 700;
    transition: all 0.15s ease;
    cursor: pointer;
  }
  .arch-tools .chip:visited,
  .arch-tools .nav-link:visited {
    color: #ffffff !important;
  }
  .arch-tools .chip span,
  .arch-tools .nav-link span {
    color: #ffffff !important;
    font-weight: 700;
  }
  .arch-tools .chip .ico,
  .arch-tools .nav-link .ico,
  .arch-tools .chip svg,
  .arch-tools .nav-link svg {
    color: #ffffff !important;
    fill: currentColor;
    stroke: currentColor;
  }
  .arch-tools .chip:hover,
  .arch-tools .nav-link:hover {
    background: rgba(255, 255, 255, 0.18);
    border-color: rgba(255, 255, 255, 0.35);
    color: #ffffff !important;
    transform: translateY(-1px);
  }
  .arch-tools .chip:hover span,
  .arch-tools .nav-link:hover span {
    color: #ffffff !important;
  }
  .main-container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px 16px 60px;
    width: 100%;
    box-sizing: border-box;
    flex: 1;
  }
  .search-section {
    background: #0d1527;
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 20px;
    box-shadow: 0 8px 24px -12px rgba(0,0,0,0.5);
  }
  .search-input-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }
  .search-icon {
    position: absolute;
    right: 14px;
    color: #64748b;
    pointer-events: none;
    display: flex;
  }
  .search-input {
    width: 100%;
    padding: 12px 42px 12px 14px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(0,0,0,0.3);
    color: #fff;
    font: inherit;
    font-size: 15px;
    box-sizing: border-box;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .search-input:focus {
    border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59,130,246,0.25);
  }
  .filter-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  .tabs {
    display: flex;
    background: rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 3px;
    gap: 4px;
  }
  .tab-btn {
    border: none;
    background: transparent;
    color: #94a3b8;
    padding: 7px 16px;
    border-radius: 7px;
    font: inherit;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .tab-btn:hover { color: #f1f5f9; }
  .tab-btn.active {
    background: #1e293b;
    color: #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.35);
  }
  .tab-btn.active.bar-tab {
    background: #15803d;
    color: #fff;
  }
  .badge-count {
    background: rgba(255,255,255,0.16);
    padding: 2px 7px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 800;
  }
  .select-filter {
    background: rgba(0,0,0,0.35);
    color: #e2e8f0;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    padding: 7px 12px;
    font: inherit;
    font-size: 13px;
    outline: none;
    cursor: pointer;
  }
  .btn-export {
    background: rgba(255,255,255,0.08);
    color: #e2e8f0;
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 8px;
    padding: 7px 14px;
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: 0.15s;
    margin-inline-start: auto;
  }
  .btn-export:hover {
    background: rgba(255,255,255,0.16);
    color: #fff;
  }
  /* خانة كل يوم — مطوية افتراضياً وتُفتح بالضغط */
  .day {
    border: 1px solid rgba(255, 255, 255, 0.10);
    border-radius: 14px;
    background: #0d1527;
    margin-bottom: 14px;
    overflow: hidden;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .day:hover {
    border-color: rgba(255, 255, 255, 0.18);
  }
  .day.open {
    border-color: rgba(59, 130, 246, 0.45);
    box-shadow: 0 8px 24px -10px rgba(0,0,0,0.5);
  }
  .day-head {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    background: rgba(255, 255, 255, 0.03);
    border: none;
    color: #ffffff;
    text-align: inherit;
    font: inherit;
    cursor: pointer;
    transition: background 0.15s;
  }
  .day-head:hover {
    background: rgba(255, 255, 255, 0.07);
  }
  .day.open .day-head {
    background: rgba(255, 255, 255, 0.05);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }
  .day-head .dicon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #60a5fa;
  }
  .day-head .day-title {
    font-size: 15px;
    font-weight: 800;
    color: #ffffff;
  }
  .day-head .day-badge {
    background: rgba(59, 130, 246, 0.18);
    color: #93c5fd;
    border: 1px solid rgba(59, 130, 246, 0.32);
    border-radius: 999px;
    padding: 3px 12px;
    font-size: 12.5px;
    font-weight: 700;
  }
  .day-head .car {
    margin-inline-start: auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.25s ease;
    color: #94a3b8;
  }
  .day.open .day-head .car {
    transform: rotate(180deg);
    color: #3b82f6;
  }
  .day-body {
    display: none;
    padding: 14px 16px 16px;
  }
  .day.open .day-body {
    display: block;
    animation: dayOpen 0.25s ease-out;
  }
  @keyframes dayOpen {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .day-close {
    width: 100%;
    margin-top: 14px;
    padding: 10px;
    border-radius: 10px;
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.10);
    color: #cbd5e1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.15s;
  }
  .day-close:hover {
    background: rgba(255, 255, 255, 0.10);
    color: #ffffff;
  }
  .cards-grid {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .arch-card {
    background: #0d1527;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 14px 18px;
    box-shadow: 0 6px 18px -8px rgba(0,0,0,0.4);
    transition: transform 0.15s, border-color 0.15s;
  }
  .arch-card:hover {
    border-color: rgba(255,255,255,0.18);
  }
  .arch-card.bar-card {
    border-inline-start: 4px solid #16a34a;
  }
  .arch-card.urgent-card {
    border-inline-start: 4px solid #dc2626;
  }
  .arch-card.note-card {
    border-inline-start: 4px solid #2563eb;
  }
  .card-top {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    color: var(--text-muted);
    margin-bottom: 8px;
  }
  .tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 11.5px;
    font-weight: 800;
    color: #fff;
  }
  .tag.urgent { background: #dc2626; }
  .tag.note { background: #2563eb; }
  .tag.bar { background: #16a34a; }
  /* نقطة نابضة خفيفة داخل شارات النوع — نفس تأثير صفحات العرض والإرسال */
  .tag .livedot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#fff;animation:live 1.6s infinite}
  .tag.note .livedot{background:#bfdbfe}
  .tag.bar .livedot{background:#bbf7d0}
  @keyframes live{0%{box-shadow:0 0 0 0 rgba(255,255,255,.65)}70%{box-shadow:0 0 0 7px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
  .card-author {
    font-weight: 700;
    color: #cbd5e1;
  }
  .card-time {
    margin-inline-start: auto;
    font-variant-numeric: tabular-nums;
  }
  .card-text {
    font-size: 16px;
    font-weight: 700;
    line-height: 1.7;
    margin: 0;
    color: #f8fafc;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .card-foot {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid rgba(255,255,255,0.05);
    font-size: 12.5px;
  }
  .ack-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 9px;
    border-radius: 6px;
    font-size: 11.5px;
    font-weight: 700;
  }
  .ack-pill.copied {
    background: rgba(34,197,94,0.14);
    color: #86efac;
    border: 1px solid rgba(34,197,94,0.25);
  }
  .ack-pill.copied .ico{animation:copiedStatusPulse 1.8s ease-in-out infinite;transform-origin:center}
  @keyframes copiedStatusPulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 0 rgba(52,211,153,0))}50%{transform:scale(1.16);filter:drop-shadow(0 0 4px rgba(52,211,153,.68))}}
  @media (prefers-reduced-motion:reduce){.ack-pill.copied .ico{animation:none}}
  .ack-pill.pending {
    background: rgba(239,68,68,0.14);
    color: #fca5a5;
    border: 1px solid rgba(239,68,68,0.25);
  }
  .btn-copy {
    background: rgba(255,255,255,0.09);
    color: #f1f5f9;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    padding: 5px 14px;
    font: inherit;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-inline-start: auto;
    transition: 0.15s;
  }
  .btn-copy:hover {
    background: #2563eb;
    border-color: #3b82f6;
    color: #fff;
  }
  /* مجموعة إجراءات البطاقة: نسخ + (تعديل/حذف للمحررين) — في الجوال أيقونات فقط حتى لا تزحم السطر */
  .card-acts { margin-inline-start: auto; display: inline-flex; align-items: center; gap: 8px; }
  .card-acts .btn-copy { margin-inline-start: 0; }
  .btn-edit:hover { background: #2563eb; border-color: #3b82f6; color: #fff; }
  .btn-del:hover { background: #dc2626; border-color: #ef4444; color: #fff; }
  @media (max-width: 640px) {
    .card-acts .btn-copy, .card-acts .btn-edit, .card-acts .btn-del { padding: 6px 9px; }
    .card-acts .btn-copy .txt, .card-acts .btn-edit .txt, .card-acts .btn-del .txt { display: none; }
  }
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }
  .empty-state i {
    opacity: 0.4;
    margin-bottom: 12px;
  }
  .empty-state h3 {
    font-size: 17px;
    font-weight: 800;
    margin: 0 0 6px;
    color: #cbd5e1;
  }
  .empty-state p {
    font-size: 13.5px;
    margin: 0;
  }
  .arch-stats {
    display: flex;
    gap: 16px;
    margin-bottom: 16px;
  }
  .stat-card {
    flex: 1;
    background: #0d1527;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .stat-val {
    font-size: 22px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .stat-lbl {
    font-size: 12px;
    color: var(--text-muted);
  }
  @media (max-width: 768px) {
    .filter-row { flex-direction: column; align-items: stretch; }
    .btn-export { margin-inline-start: 0; justify-content: center; }
    .arch-stats { flex-direction: column; }
    .arch-nav { padding: 10px 14px; }
  }
</style>
</head>
<body>

<header class="arch-nav">
  <div class="arch-brand">
    <img class="arch-logo" src="assets/logo-320.png" alt="اليمن اليوم" />
    <div class="arch-title">
      <h1>أرشيف الأخبار والشريط</h1>
      <p>غرفة الأخبار — السجل الشامل</p>
    </div>
  </div>
  <div class="grow"></div>
  <div class="arch-tools">
    <div class="chip" id="archiveConn" title="اتصال قاعدة البيانات" aria-live="polite"><span id="archiveConnDot" style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#f59e0b"></span><span id="archiveConnText">جارٍ الاتصال…</span></div>
    <button class="chip nav-link" id="archiveLogout" type="button" title="تسجيل الخروج"><i class="ico" data-ic="exit"></i><span>تسجيل الخروج</span></button>
  </div>
</header>

<main class="main-container">
  <!-- إحصاءات سريعة -->
  <div class="arch-stats">
    <div class="stat-card">
      <div class="tag urgent" style="padding:8px"><i class="ico" data-ic="send" style="width:20px;height:20px"></i></div>
      <div>
        <div class="stat-val" id="totalNews">0</div>
        <div class="stat-lbl">إجمالي الأخبار المؤرشفة</div>
      </div>
    </div>
    <div class="stat-card" id="barsStat">
      <div class="tag bar" style="padding:8px"><i class="ico" data-ic="inbox" style="width:20px;height:20px"></i></div>
      <div>
        <div class="stat-val" id="totalBars">0</div>
        <div class="stat-lbl">إجمالي أشرطة الأخبار</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="tag note" style="padding:8px"><i class="ico" data-ic="check" style="width:20px;height:20px"></i></div>
      <div>
        <div class="stat-val" id="totalDays">0</div>
        <div class="stat-lbl">عدد الأيام المحفوظة</div>
      </div>
    </div>
  </div>

  <!-- البحث والفلترة -->
  <section class="search-section">
    <div class="search-input-wrap">
      <span class="search-icon"><i class="ico" data-ic="search"></i></span>
      <input type="text" id="searchInput" class="search-input" placeholder="ابحث في نص الخبر، الكلمات، أو اسم المحرر…" />
    </div>

    <div class="filter-row">
      <div class="tabs">
        <button type="button" class="tab-btn active" id="tabNews" data-tab="news">
          <i class="ico" data-ic="send"></i>
          <span>الأخبار والملاحظات</span>
          <span class="badge-count" id="countNewsBadge">0</span>
        </button>
        <button type="button" class="tab-btn bar-tab" id="tabBars" data-tab="bars">
          <i class="ico" data-ic="inbox"></i>
          <span>أشرطة الأخبار</span>
          <span class="badge-count" id="countBarsBadge">0</span>
        </button>
      </div>

      <select id="authorFilter" class="select-filter">
        <option value="">جميع المحررين</option>
      </select>

      <select id="dateFilter" class="select-filter">
        <option value="">جميع الأيام</option>
      </select>

      <button type="button" class="btn-export" id="btnExportTxt" title="تصدير السجل كملف نصي">
        <i class="ico" data-ic="copy"></i>
        <span>تصدير ملف نصي (.txt)</span>
      </button>

      <button type="button" class="btn-export" id="btnExportJson" title="تصدير كملف بيانات نسخة احتياطية">
        <i class="ico" data-ic="back"></i>
        <span>تصدير نسخة احتياطية (.json)</span>
      </button>
    </div>
  </section>

  <!-- حاوية القائمة -->
  <div id="feedContent"></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 12px 30px">
    <button type="button" id="btnLoadOlder" class="btn-export" style="display:none">تحميل السجلات الأقدم</button>
    <p id="archiveLoadStatus" style="margin:0;color:#94a3b8;font-size:13px;text-align:center"></p>
  </div>
</main>

<script src="config.js?v=4.18.25"></script>
<script src="supabase-runtime.js?v=4.18.25"></script>
<script src="core.js?v=4.18.25"></script>
<script>
(function () {
  'use strict';
  var U = window.URGENT;
  var cfg = U.config();
  var room = U.room();
  var BASE = 'urgent/' + room + '/';

  var store = U.createStore({ room: room, limit: 10000, persist: false });
  var currentTab = 'news'; // 'news' | 'bars'
  var canViewBars = false;
  var memberRole = '';
  var searchQuery = '';
  var authorQuery = '';
  var dateQuery = '';
  var openDays = {}; // الأيام المفتوحة حالياً (افتراضياً كل الأيام مطوية)
  var loadedOffset = 0, totalItems = 0, loadingOlder = false, renderScheduled = false;
  var maxArchiveRows = 10000, archivePageSize = 500;

  var feedContent = U.$('#feedContent');
  var searchInput = U.$('#searchInput');
  var tabNews = U.$('#tabNews');
  var tabBars = U.$('#tabBars');
  var authorFilter = U.$('#authorFilter');
  var dateFilter = U.$('#dateFilter');
  var btnExportTxt = U.$('#btnExportTxt');
  var btnExportJson = U.$('#btnExportJson');

  var totalNewsEl = U.$('#totalNews');
  var totalBarsEl = U.$('#totalBars');
  var totalDaysEl = U.$('#totalDays');
  var countNewsBadge = U.$('#countNewsBadge');
  var countBarsBadge = U.$('#countBarsBadge');
  var btnLoadOlder = U.$('#btnLoadOlder');
  var archiveLoadStatus = U.$('#archiveLoadStatus');
  var archiveConn = U.$('#archiveConn');
  var archiveConnDot = U.$('#archiveConnDot');
  var archiveConnText = U.$('#archiveConnText');

  // اتصال بالبث لتحديث الأرشيف لحظياً عند وصول أي خبر أو شريط
  var bus = U.createBus({
    base: BASE,
    role: 'archive',
    who: 'archive',
    name: 'الأرشيف',
    onState: function (state, info) {
      if (state === 'connected') {
        var ms = info && Number(info.latencyMs) >= 0 ? Math.round(Number(info.latencyMs)) : null;
        archiveConnDot.style.background = '#22c55e';
        archiveConnText.textContent = 'Realtime' + (ms === null ? '' : ' · ' + ms + 'ms');
        archiveConn.title = 'متصل عبر Supabase Realtime' + (ms === null ? '' : ' — زمن الاستجابة ' + ms + ' مللي ثانية');
      } else if (state === 'connecting') {
        archiveConnDot.style.background = '#f59e0b'; archiveConnText.textContent = 'اتصال…'; archiveConn.title = 'جارٍ الاتصال بـ Supabase Realtime';
      } else {
        archiveConnDot.style.background = '#ef4444'; archiveConnText.textContent = 'منقطع'; archiveConn.title = 'الاتصال غير متاح؛ سيُعاد الاتصال تلقائياً';
      }
    },
    onMessage: function (topic, data, isEmpty, isInitial) {
      var rel = topic;
      if (memberRole === 'reader' && (rel.indexOf('note/') === 0 || rel.indexOf('bar/') === 0)) return; // القارئ: أخبار فقط
      if (rel.indexOf('news/') === 0) {
        if (isEmpty) { store.remove(rel.slice(5)); if (!isInitial) totalItems = Math.max(0, totalItems - 1); }
        else if (data && data.t) { var newsResult = store.applyNews(data); if (!isInitial && newsResult && newsResult.isNew) totalItems++; }
      } else if (rel.indexOf('note/') === 0) {
        if (isEmpty) { store.remove(rel.slice(5)); if (!isInitial) totalItems = Math.max(0, totalItems - 1); }
        else if (data && data.t) { var noteResult = store.applyNote(data); if (!isInitial && noteResult && noteResult.isNew) totalItems++; }
      } else if (rel.indexOf('bar/') === 0) {
        if (!canViewBars) return;
        if (isEmpty) { store.remove(rel.slice(4)); if (!isInitial) totalItems = Math.max(0, totalItems - 1); }
        else if (data && data.t) { var barResult = store.applyBar(data); if (!isInitial && barResult && barResult.isNew) totalItems++; }
      } else if (rel.indexOf('ack/') === 0) {
        if (memberRole === 'reader') return; // حساب الاستعراض: لا تصله حالة أو تفاصيل النسخ إطلاقاً
        if (!isEmpty && data) store.applyAck(data);
      } else if (rel.indexOf('pin/') === 0) {
        store.applyPin(data || { id: rel.slice(4) }, !isEmpty);
      }
      if (!isInitial) { updateArchivePagination(); scheduleRender(); }
    },
    onReady: function (info) {
      loadedOffset = Number(info && info.snapshotCount) || 0;
      render();
      bus.getArchiveCount().then(function (count) { totalItems = count; updateArchivePagination(); })
        .catch(function () { archiveLoadStatus.textContent = 'تعذّر عدّ سجلات الأرشيف؛ يمكنك متابعة العرض الحالي.'; });
    }
  });

  function updateArchivePagination() {
    if (loadedOffset >= totalItems || !totalItems) {
      btnLoadOlder.style.display = 'none';
      archiveLoadStatus.textContent = totalItems ? 'تم تحميل السجلات المتاحة (' + loadedOffset + ' من ' + totalItems + ').' : 'لا توجد سجلات محفوظة بعد.';
      return;
    }
    if (loadedOffset >= maxArchiveRows) {
      btnLoadOlder.style.display = 'none';
      archiveLoadStatus.textContent = 'يعرض المتصفح أول ' + maxArchiveRows + ' سجل للحفاظ على سرعة الصفحة؛ بقية السجلات ما تزال محفوظة في قاعدة البيانات.';
      return;
    }
    btnLoadOlder.style.display = 'inline-flex';
    btnLoadOlder.disabled = loadingOlder;
    btnLoadOlder.textContent = loadingOlder ? 'جارٍ التحميل…' : 'تحميل السجلات الأقدم (' + Math.min(archivePageSize, totalItems - loadedOffset) + ')';
    archiveLoadStatus.textContent = 'عُرض ' + loadedOffset + ' من ' + totalItems + ' سجل.';
  }

  function loadOlder() {
    if (loadingOlder || loadedOffset >= totalItems || loadedOffset >= maxArchiveRows) return;
    loadingOlder = true; updateArchivePagination();
    var size = Math.min(archivePageSize, maxArchiveRows - loadedOffset);
    bus.fetchArchivePage(loadedOffset, size).then(function (result) {
      loadedOffset = result.nextOffset;
      if (result.done) totalItems = loadedOffset;
      render();
    }).catch(function (err) {
      U.toast(err.message || 'تعذّر تحميل السجلات الأقدم؛ تحقق من الاتصال.', 'warn', 6000);
    }).then(function () { loadingOlder = false; updateArchivePagination(); });
  }

  function scheduleRender() {
    if (renderScheduled) return;
    renderScheduled = true;
    var run = function () { renderScheduled = false; render(); };
    if (window.requestAnimationFrame) window.requestAnimationFrame(run);
    else setTimeout(run, 100);
  }

  function init() {
    // إن دخل المستخدم من شاشة الاستقبال على هذا الجهاز، تُعتمد جلسته هنا دون طلب الدخول مجدداً
    try {
      var sc = (window.URGENT_CONFIG && window.URGENT_CONFIG.supabase) || {};
      var pageKey = 'sb-' + new URL(sc.url).hostname.split('.')[0] + '-auth-token';
      if (sc.url && sc.roomId && !localStorage.getItem(pageKey)) {
        var displaySession = localStorage.getItem('urgent-display-auth-' + String(sc.roomId));
        if (displaySession) localStorage.setItem(pageKey, displaySession);
      }
    } catch (e) {}
    window.URGENT_SUPABASE.requirePage({
      roles: ['admin', 'editor', 'operator', 'reader'],
      onReady: function (member) {
        memberRole = member && member.role ? String(member.role) : '';
        canViewBars = !!(member && member.role !== 'reader' && member.canViewBar === true);
        if (!canViewBars) {
          currentTab = 'news';
          tabBars.style.display = 'none';
          var barsStat = U.$('#barsStat');
          if (barsStat) barsStat.style.display = 'none';
        }
        initAuthenticated();
      }
    });
  }

  function initAuthenticated() {
    store.load();
    bus.connect();
    wireEvents();
    render();
    U.hydrateIcons(document);
  }

  function wireEvents() {
    // إخفاء الهيدر بسلاسة مع التمرير لأسفل وإظهاره عند التمرير لأعلى أو العودة للقمة
    var lastScrollY = window.pageYOffset || document.documentElement.scrollTop || 0;
    var navEl = document.querySelector('.arch-nav');
    window.addEventListener('scroll', function () {
      var curY = window.pageYOffset || document.documentElement.scrollTop || 0;
      if (curY <= 15) {
        navEl.classList.remove('nav-hidden');
      } else if (curY > lastScrollY && curY > 50) {
        navEl.classList.add('nav-hidden');
      } else if (lastScrollY - curY > 10) {
        navEl.classList.remove('nav-hidden');
      }
      lastScrollY = curY;
    }, { passive: true });

    searchInput.addEventListener('input', function () {
      searchQuery = (searchInput.value || '').trim().toLowerCase();
      render();
    });

    tabNews.addEventListener('click', function () {
      currentTab = 'news';
      tabNews.classList.add('active');
      tabBars.classList.remove('active');
      render();
    });

    tabBars.addEventListener('click', function () {
      if (!canViewBars) return;
      currentTab = 'bars';
      tabBars.classList.add('active');
      tabNews.classList.remove('active');
      render();
    });

    authorFilter.addEventListener('change', function () {
      authorQuery = authorFilter.value;
      render();
    });

    dateFilter.addEventListener('change', function () {
      dateQuery = dateFilter.value;
      render();
    });

    btnExportTxt.addEventListener('click', exportTxt);
    btnExportJson.addEventListener('click', exportJson);
    btnLoadOlder.addEventListener('click', loadOlder);

    U.$('#archiveLogout').addEventListener('click', function () {
      if (!confirm('تسجيل الخروج من الأرشيف على هذا الجهاز؟')) return;
      bus.end();
      window.URGENT_SUPABASE.signOut().finally(function () { location.reload(); });
    });

    feedContent.addEventListener('click', function (e) {
      // فتح أو طي خانة اليوم
      var headBtn = e.target.closest('.day-head');
      if (headBtn) {
        var dayWrap = headBtn.closest('.day');
        if (dayWrap) {
          var dk = dayWrap.getAttribute('data-day');
          var willOpen = !dayWrap.classList.contains('open');
          openDays[dk] = willOpen;
          dayWrap.classList.toggle('open', willOpen);
        }
        return;
      }
      // إغلاق خانة اليوم من زر الطي الداخلي
      var closeBtn = e.target.closest('.day-close');
      if (closeBtn) {
        var dayWrap2 = closeBtn.closest('.day');
        if (dayWrap2) {
          var dk2 = dayWrap2.getAttribute('data-day');
          openDays[dk2] = false;
          dayWrap2.classList.remove('open');
        }
        return;
      }
      // نسخ النص
      var copyBtn = e.target.closest('[data-copy-text]');
      if (copyBtn) {
        var text = copyBtn.getAttribute('data-copy-text');
        U.copyText(text).then(function (ok) {
          U.toast(ok ? 'تم نسخ النص إلى الحافظة' : 'تعذر النسخ التلقائي', ok ? 'ok' : 'warn');
        });
        return;
      }
      // تعديل النص (مالك/محرر) — حتى لأقدم أرشيف
      var editBtn = e.target.closest('[data-edit-id]');
      if (editBtn) {
        if (memberRole !== 'admin' && memberRole !== 'editor') { U.toast('التعديل متاح للمالك والمحررين فقط.', 'warn'); return; }
        var eid = editBtn.getAttribute('data-edit-id');
        var eit = store.get(eid);
        if (!eit) return;
        var ekind = eit.bar ? 'الشريط' : (eit.note ? 'الملاحظة' : 'الخبر');
        var next = prompt('عدّل نص ' + ekind + ':', eit.text || '');
        if (next == null) return;
        next = String(next).trim();
        if (!next) { U.toast('لا يمكن أن يكون النص فارغاً.', 'warn'); return; }
        if (next === String(eit.text || '')) return;
        if (!confirm('حفظ التعديل على ' + ekind + ' في الأرشيف وكل الأجهزة؟')) return;
        var nowE = Date.now();
        bus.publish((eit.bar ? 'bar/' : (eit.note ? 'note/' : 'news/')) + eid,
          { id: eid, t: next, a: eit.author || 'غرفة الأخبار', ts: Number(eit.ts) || nowE, e: nowE });
        store.applyNews({ id: eid, t: next, a: eit.author || 'غرفة الأخبار', ts: Number(eit.ts) || nowE, e: nowE, n: eit.note ? 1 : undefined, bar: eit.bar ? 1 : undefined });
        render();
        U.toast('تم حفظ التعديل', 'ok');
        return;
      }
      // حذف نهائي (مالك/محرر) — من الأرشيف وكل الأجهزة
      var delBtn = e.target.closest('[data-del-id]');
      if (delBtn) {
        if (memberRole !== 'admin' && memberRole !== 'editor') { U.toast('الحذف متاح للمالك والمحررين فقط.', 'warn'); return; }
        var did = delBtn.getAttribute('data-del-id');
        var dit = store.get(did);
        if (!dit) return;
        var dkind = dit.bar ? 'الشريط' : (dit.note ? 'الملاحظة' : 'الخبر');
        if (!confirm('حذف ' + dkind + ' نهائياً من الأرشيف وكل الأجهزة؟')) return;
        if (!confirm('تأكيد أخير: لا يمكن التراجع — حذف؟')) return;
        bus.publish('ctrl', { action: 'delete', id: did });
        store.remove(did);
        render();
        U.toast('تم حذف ' + dkind, 'ok');
        return;
      }
    });
  }

  function getAllItems() {
    return store.list().filter(function (it) { return canViewBars || !it.bar; })
      .slice().sort(function (a, b) { return b.ts - a.ts; });
  }

  function syncFilters(items) {
    // قائمة المحررين
    var authors = {};
    var dates = {};
    items.forEach(function (it) {
      if (it.author) authors[it.author] = true;
      var dk = U.dayKeyOf(it.ts);
      dates[dk] = true;
    });

    var curA = authorFilter.value;
    authorFilter.innerHTML = '<option value="">جميع المحررين (' + Object.keys(authors).length + ')</option>';
    Object.keys(authors).sort().forEach(function (a) {
      var opt = document.createElement('option');
      opt.value = a;
      opt.textContent = a;
      if (a === curA) opt.selected = true;
      authorFilter.appendChild(opt);
    });

    var curD = dateFilter.value;
    dateFilter.innerHTML = '<option value="">جميع الأيام (' + Object.keys(dates).length + ')</option>';
    Object.keys(dates).sort().reverse().forEach(function (k) {
      var opt = document.createElement('option');
      opt.value = k;
      opt.textContent = U.dayLabel(k);
      if (k === curD) opt.selected = true;
      dateFilter.appendChild(opt);
    });
  }

  function render() {
    var all = getAllItems();
    var newsList = all.filter(function (it) { return !it.bar; });
    var barsList = all.filter(function (it) { return !!it.bar; });

    var g = U.groupByDay(all);
    U.txt(totalNewsEl, String(newsList.length));
    U.txt(totalBarsEl, String(barsList.length));
    U.txt(totalDaysEl, String(g.days.length + (g.todayItems.length ? 1 : 0)));
    U.txt(countNewsBadge, String(newsList.length));
    U.txt(countBarsBadge, String(barsList.length));

    syncFilters(all);

    var targetList = (currentTab === 'bars') ? barsList : newsList;

    // تطبيق الفلاتر
    var filtered = targetList.filter(function (it) {
      if (authorQuery && it.author !== authorQuery) return false;
      if (dateQuery && U.dayKeyOf(it.ts) !== dateQuery) return false;
      if (searchQuery) {
        var txt = (it.text || '').toLowerCase();
        var aut = (it.author || '').toLowerCase();
        if (txt.indexOf(searchQuery) === -1 && aut.indexOf(searchQuery) === -1) return false;
      }
      return true;
    });

    feedContent.innerHTML = '';

    if (!filtered.length) {
      feedContent.innerHTML =
        '<div class="empty-state">' +
          '<i class="ico" data-ic="inbox" style="width:48px;height:48px"></i>' +
          '<h3>لا توجد نتائج مطابقة للبحث</h3>' +
          '<p>جرّب تغيير كلمات البحث أو اختيار تاريخ ومحرر مختلفين.</p>' +
        '</div>';
      U.hydrateIcons(feedContent);
      return;
    }

    // تجميع باليوم
    var dayGroups = {};
    var dayKeys = [];
    filtered.forEach(function (it) {
      var dk = U.dayKeyOf(it.ts);
      if (!dayGroups[dk]) {
        dayGroups[dk] = [];
        dayKeys.push(dk);
      }
      dayGroups[dk].push(it);
    });

    dayKeys.forEach(function (dk) {
      var items = dayGroups[dk];
      // افتراضياً: أخبار كل يوم مطوية في خانة بتاريخ ذلك اليوم
      // تُفتح تلقائياً فقط إذا كان هناك بحث نشط لتسهيل معاينة النتائج المباشرة
      var isOpen = !!openDays[dk] || (!!searchQuery && searchQuery.length > 0);

      var dayWrap = document.createElement('section');
      dayWrap.className = 'day' + (isOpen ? ' open' : '');
      dayWrap.setAttribute('data-day', dk);

      var headBtn = document.createElement('button');
      headBtn.type = 'button';
      headBtn.className = 'day-head';
      headBtn.innerHTML =
        '<span class="dicon"><i class="ico" data-ic="inbox"></i></span>' +
        '<span class="day-title">' + U.dayLabel(dk) + '</span>' +
        '<span class="day-badge">' + items.length + ' ' + (currentTab === 'bars' ? 'شريط' : 'خبر') + '</span>' +
        '<span class="car"><i class="ico" data-ic="chevron"></i></span>';
      dayWrap.appendChild(headBtn);

      var bodyEl = document.createElement('div');
      bodyEl.className = 'day-body';

      var gridEl = document.createElement('div');
      gridEl.className = 'cards-grid';

      items.forEach(function (it) {
        var card = document.createElement('article');
        card.className = 'arch-card ' + (it.bar ? 'bar-card' : (it.note ? 'note-card' : 'urgent-card'));

        var isCopied = it.ack && (it.ack.kind === 'copied' || it.ack.kind === 'got');
        // حالة النسخ: أيقونة صح + توقيت النسخ فقط — بديهي أن المنفذ هو من نسخ، ولا تمييز للأرشيف المستورد
        var copyStatus = isCopied
          ? '<span class="ack-pill copied"><i class="ico" data-ic="check"></i>' + U.fmtTime(it.ack.ts) + '</span>'
          : '<span class="ack-pill pending">بانتظار النسخ</span>';

        var tagClass = it.bar ? 'bar' : (it.note ? 'note' : 'urgent');
        var tagLabel = it.bar ? 'شريط إخباري' : (it.note ? 'ملاحظة' : 'خبر عاجل');
        var canEdit = memberRole === 'admin' || memberRole === 'editor';

        card.innerHTML =
          '<div class="card-top">' +
            '<span class="tag ' + tagClass + '"><i class="livedot"></i>' + tagLabel + '</span>' +
            '<span class="card-author">' + (it.author || 'غرفة الأخبار') + '</span>' +
            (it.editedAt ? '<span style="color:#f59e0b;font-size:11px">محدّث ' + U.fmtTime(it.editedAt) + '</span>' : '') +
            '<span class="card-time">' + U.fmtTime(it.ts) + '</span>' +
          '</div>' +
          '<p class="card-text">' + escapeHtml(it.text || '') + '</p>' +
          '<div class="card-foot">' +
            (memberRole === 'reader' ? '' : copyStatus) +
            '<span style="color:#64748b;font-size:11.5px">' + countWords(it.text) + ' كلمة</span>' +
            '<span class="card-acts">' +
              '<button type="button" class="btn-copy" data-copy-text="' + escapeAttr(it.text || '') + '">' +
                '<i class="ico" data-ic="copy"></i><span class="txt">نسخ النص</span>' +
              '</button>' +
              (canEdit ? '<button type="button" class="btn-copy btn-edit" data-edit-id="' + escapeAttr(it.id) + '" title="تعديل النص">' +
                '<i class="ico" data-ic="edit"></i><span class="txt">تعديل</span>' +
              '</button>' : '') +
              (canEdit ? '<button type="button" class="btn-copy btn-del" data-del-id="' + escapeAttr(it.id) + '" title="حذف نهائي">' +
                '<i class="ico" data-ic="trash"></i><span class="txt">حذف</span>' +
              '</button>' : '') +
            '</span>' +
          '</div>';

        gridEl.appendChild(card);
      });

      bodyEl.appendChild(gridEl);

      var closeBtn = document.createElement('button');
      closeBtn.type = 'button';
      closeBtn.className = 'day-close';
      closeBtn.innerHTML = '<i class="ico" data-ic="chevron" style="transform:rotate(180deg)"></i><span>إغلاق هذا اليوم — طيّ الأخبار</span>';
      bodyEl.appendChild(closeBtn);

      dayWrap.appendChild(bodyEl);
      feedContent.appendChild(dayWrap);
    });

    U.hydrateIcons(feedContent);
  }

  function countWords(s) {
    var m = String(s || '').replace(/^\s+|\s+$/g, '').match(/[\u0600-\u06FF\w]+/g);
    return m ? m.length : 0;
  }

  function escapeHtml(s) {
    return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function escapeAttr(s) {
    return String(s || '').replace(/"/g, '&quot;');
  }

  function exportTxt() {
    var all = getAllItems();
    var list = (currentTab === 'bars') ? all.filter(function (it) { return !!it.bar; }) : all.filter(function (it) { return !it.bar; });
    if (!list.length) { U.toast('لا توجد بيانات لتصديرها', 'warn'); return; }

    var title = currentTab === 'bars' ? 'أرشيف أشرطة الأخبار — اليمن اليوم' : 'أرشيف الأخبار العاجلة — اليمن اليوم';
    var lines = [
      '====================================================',
      title,
      'تاريخ التصدير: ' + new Date().toLocaleString('ar-YE'),
      'إجمالي المحتوى: ' + list.length + (currentTab === 'bars' ? ' شريط' : ' خبر'),
      '====================================================\n'
    ];

    var g = U.groupByDay(list);
    var allDays = (g.todayItems.length ? [g.todayKey] : []).concat(g.days);
    var dayMap = {};
    list.forEach(function (it) {
      var dk = U.dayKeyOf(it.ts);
      (dayMap[dk] = dayMap[dk] || []).push(it);
    });

    Object.keys(dayMap).sort().reverse().forEach(function (dk) {
      lines.push('\n### ' + U.dayLabel(dk) + ' (' + dayMap[dk].length + ' خبر)');
      lines.push('----------------------------------------------------');
      dayMap[dk].forEach(function (it, idx) {
        var num = idx + 1;
        var time = U.fmtTime(it.ts);
        var auth = it.author || 'غرفة الأخبار';
        var kind = it.bar ? '[شريط]' : (it.note ? '[ملاحظة]' : '[عاجل]');
        lines.push(num + '. ' + kind + ' (' + time + ' - ' + auth + '):');
        lines.push(it.text);
        lines.push('');
      });
    });

    var blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' });
    downloadBlob(blob, (currentTab === 'bars' ? 'archive-bars-' : 'archive-news-') + Date.now() + '.txt');
    U.toast('تم تحميل ملف الأرشيف النصي', 'ok');
  }

  function exportJson() {
    var all = getAllItems();
    if (!all.length) { U.toast('لا توجد بيانات لتصديرها', 'warn'); return; }
    var out = all;
    if (memberRole === 'reader') {
      // حساب الاستعراض: التصدير يقتصر على محتوى الخبر — تُجرَد العناصر من أي بيانات نسخ أو إقرار
      out = all.map(function (it) {
        var c = {};
        Object.keys(it || {}).forEach(function (k) { if (k !== 'ack') c[k] = it[k]; });
        return c;
      });
    }
    var data = {
      channel: (cfg.channel && cfg.channel.title) || 'اليمن اليوم',
      exportedAt: new Date().toISOString(),
      count: out.length,
      items: out
    };
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json;charset=utf-8' });
    downloadBlob(blob, 'urgent-archive-backup-' + Date.now() + '.json');
    U.toast('تم تصدير النسخة الاحتياطية كملف JSON', 'ok');
  }

  function downloadBlob(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 200);
  }

  init();
})();
</script>
